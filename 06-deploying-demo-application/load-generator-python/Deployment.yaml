apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator-python
  namespace: demo-app 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator-python
  template:
    metadata:
      labels:
        app: load-generator-python
    spec:
      containers:
      - name: load-generator-python
        image: python:3.9-slim
        imagePullPolicy: Always
        env:
          - name: API_URL
            value: http://api-node.demo-app.svc.cluster.local:3000
          - name: DELAY_MS
            value: "1000"
         # Could alternatively move these to a configmap
         # envFrom:
         #   - configMapRef:
         #       name: load-generator-config
         resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
      imaegePullSecrets:
        - name: dockerconfigjson
      securityContext:
        seccompProfile:
          type: RuntimeDefault
