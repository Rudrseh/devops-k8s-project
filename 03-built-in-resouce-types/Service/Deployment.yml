apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  #namespace: 04-service
  labels:
   foo: deployment-label
  annotations:
   bar: deployment-annotation
spec:
  replicas: 2
  selector:
    matchLabels:
      baz: pod-label
  template:
    metadata:
      labels:
        baz: pod-label
      annotations:
        foo: pod-annotation
    spec:
      containers:
        - name: nginx
          image: nginx:1.26.0

