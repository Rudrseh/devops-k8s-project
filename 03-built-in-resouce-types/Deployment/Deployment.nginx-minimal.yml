apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-nginx-minimal
  namespace: my-pod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-nginx-minimal
  template:
    metadata:
      labels:
        app: deployment-nginx-minimal
    spec:
      containers:
      - name: deployment-nginx-minimal
        image: nginx:1.27.0

