apiVersion: v1
kind: Pod
metadata:
  name: nginx-better
  namespace: my-pod
spec:
  containers:
   - name: nginx
     image: nginx:latest
     ports:
      - containerPort: 8080 
        protocol: TCP
     readinessProbe:
      httpGet: 
        path: /
        port: 8080
     resources:
        limits:
          memory: "50Mi" 
        requests:
          memory: "25Mi"
          cpu: "250m"
     securityContext:
        allowPrivilegeEscalation: false
        privileged: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsUser: 1010
    runAsGroup: 1010
    runAsNonRoot: true

